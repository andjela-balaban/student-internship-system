<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page {
            size: A4;
            margin: 0;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            color: #333333;
            font-size: 11px;
            line-height: 1.5;
        }
        .layout-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        
        /* Lijeva kolona - Sidebar */
        .sidebar {
            width: 33%;
            background-color: #e4ebf3;
            padding: 35px 20px;
            vertical-align: top;
            height: 100%;
        }
        .cv-img-container {
            text-align: center;
            margin-bottom: 25px;
        }
        .cv-img {
            /* width: 190px;
            height: 220px;
            border-radius: 4px; */
            width: 190px;
            height: auto;
            max-height: 220px;
            border-radius: 0;
            border: 3px solid #ffffff;
            object-fit: cover;
        }
        .sidebar-title {
            color: #1a365d;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 4px;
            margin-top: 25px;
            margin-bottom: 12px;
        }
        .contact-item {
            margin-bottom: 10px;
            word-wrap: break-word;
            color: #475569;
        }
        .contact-label {
            font-weight: bold;
            color: #1e293b;
            display: block;
        }

        /* Desna kolona - Glavni sadrzaj */
        .main-content {
            width: 67%;
            padding: 40px 35px;
            vertical-align: top;
        }
        .student-name {
            font-size: 28px;
            font-weight: bold;
            color: #1e293b;
            text-transform: uppercase;
            margin: 0 0 30px 0;
            line-height: 1.1;
            letter-spacing: 1px;
        }
        .section-title {
            color: #1f52be;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        
        .timeline-item {
            margin-bottom: 16px;
        }
        .item-header {
            font-size: 12px;
            font-weight: bold;
            color: #0f172a;
            text-transform: uppercase;
        }
        .item-sub {
            color: #8d8d8e;
            /* font-weight: bold; */
            margin-bottom: 2px;
        }
        .item-dates {
            color: #475569;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        ul {
            margin: 5px 0 0 15px;
            padding: 0;
        }
        li {
            margin-bottom: 4px;
            color: #334155;
        }
    </style>
</head>
<body>

<table class="layout-table">
    <tr>
        <!-- LIJEVA STRANA -->
        <td class="sidebar">
            <div class="cv-img-container" th:if="${cvImageSrc != null}">
                <img th:src="${cvImageSrc}" class="cv-img" alt="CV Photo"/>
            </div>

            <div class="sidebar-title">Contact</div>
            <div class="contact-item">
                <span class="contact-label">Email</span>
                <span th:text="${cv.student?.email}">email@example.com</span>
            </div>
            <div class="contact-item">
                <span class="contact-label">Phone number</span>
                <span th:text="${cv.student?.phoneNumber}">+387 65 123 456</span>
            </div>
            <div class="contact-item">
                <span class="contact-label">Address</span>
                <span th:text="${cv.address}">Banja Luka, BiH</span>
            </div>

            <div class="sidebar-title" th:if="${cv.interests != null and !cv.interests.empty}">Interests</div>
            <p th:if="${cv.interests != null and !cv.interests.empty}" th:text="${cv.interests}" style="color: #475569;"></p>

            <div class="sidebar-title" th:if="${cv.technologies != null and !cv.technologies.empty}">Skills</div>
            <ul th:if="${cv.technologies != null and !cv.technologies.empty}">
                <li th:each="tech : ${cv.technologies}" th:text="${tech.name}">Java</li>
            </ul>
        </td>

        <!-- DESNA STRANA -->
        <td class="main-content">
            <h1 class="student-name" th:text="${cv.student?.firstName + ' ' + cv.student?.lastName}">STUDENT'S NAME</h1>

            <!-- Obrazovanje -->
            <div class="section-title" th:if="${cv.education != null and !cv.education.empty}">Education</div>
            <div class="timeline-item" th:each="edu : ${cv.education}">
                <div class="item-dates">
                    <span th:text="${edu.startDate != null ? #temporals.format(edu.startDate, 'MM/yyyy') : ''}">09/2020</span> - 
                    <span th:text="${edu.endDate != null ? #temporals.format(edu.endDate, 'MM/yyyy') : 'Currently'}">06/2024</span>
                </div>
                <div class="item-header" th:text="${edu.degree}">Degree</div>
                <div class="item-sub" th:text="${edu.institution}">Institution Name</div>
            </div>

            <!-- Radno iskustvo -->
            <div class="section-title" th:if="${cv.experience != null and !cv.experience.empty}">Work Experience</div>
            <div class="timeline-item" th:each="exp : ${cv.experience}">
                <div class="item-dates">
                    <span th:text="${exp.startDate != null ? #temporals.format(exp.startDate, 'MM/yyyy') : ''}">01/2022</span> - 
                    <span th:text="${exp.endDate != null ? #temporals.format(exp.endDate, 'MM/yyyy') : 'Currently'}">05/2023</span>
                </div>
                <div class="item-header" th:text="${exp.position}">Position</div>
                <div class="item-sub" th:text="${exp.company}">Company</div>
            </div>
        </td>
    </tr>
</table>

</body>
</html>

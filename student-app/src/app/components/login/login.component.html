<div class="login-wrapper">
  <div class="card login-card p-4 p-md-5 mx-auto">
    <div class="row align-items-center g-4 w-100 mx-0">
      
      <!-- Left Side: Logo -->
      <div class="col-12 col-md-6 text-center border-md-end pe-md-5">
        <img src="assets/img/logo.png" 
             alt="InternHub Logo" 
             class="img-fluid logo-img">
      </div>

      <!-- Right Side: Login Form -->
      <div class="col-12 col-md-6 ps-md-5">
        <h3 class="fw-bold mb-4 text-center text-md-start login-title">Welcome back!</h3>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 small mb-3" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
          
          <!-- Username Input -->
          <div class="mb-3">
            <label for="username" class="form-label form-label-sm text-secondary fw-bold">Username</label>
            <input type="text" 
                   id="username" 
                   formControlName="username" 
                   class="form-control form-control-custom">
            <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')" class="text-danger small mt-1">
              Username is required
            </div>
          </div>

          <!-- Password Input -->
          <div class="mb-4">
            <label for="password" class="form-label form-label-sm text-secondary fw-bold">Password</label>
            <div class="input-group input-group-custom">
              <input [type]="hidePassword ? 'password' : 'text'" 
                     id="password" 
                     formControlName="password" 
                     class="form-control form-control-custom border-end-0">
              <button class="btn btn-outline-secondary border-start-0 bg-white text-secondary pe-3 toggle-pwd-btn" 
                      type="button" 
                      (click)="hidePassword = !hidePassword">
                <i class="bi" [ngClass]="hidePassword ? 'bi-eye' : 'bi-eye-slash'"></i>
              </button>
            </div>
            <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')" class="text-danger small mt-1">
              Password is required
            </div>
          </div>

          <button type="submit" 
                  class="btn btn-teal w-100 fw-semibold py-2 shadow-sm" 
                  [disabled]="loginForm.invalid || loading">
            <span *ngIf="!loading">Login</span>
            <div *ngIf="loading" class="spinner-border spinner-border-sm text-white" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
